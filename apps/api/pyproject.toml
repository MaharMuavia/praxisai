[project]
name = "praxisai-api"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
  "alembic==1.16.5",
  "asyncpg==0.30.0",
  "cryptography==50.0.0",
  "email-validator==2.3.0",
  "fastapi==0.141.1",
  "google-cloud-kms==3.5.1",
  "google-cloud-storage==3.3.1",
  "google-genai==1.33.0",
  "greenlet==3.2.4",
  "httpx==0.28.1",
  "pydantic-settings==2.10.1",
  "python-multipart==0.0.32",
  "qrcode[pil]==8.2",
  "reportlab==4.4.3",
  "sqlalchemy[asyncio]==2.0.43",
  "structlog==25.4.0",
  "uvicorn[standard]==0.35.0",
]

[dependency-groups]
dev = [
  "aiosqlite==0.21.0",
  "mypy==1.17.1",
  "pip-audit==2.9.0",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "ruff==0.12.11"
]

[tool.ruff]
line-length = 100
target-version = "py313"
exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["qrcode.*", "reportlab.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
package = false
