name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  APP_ENV: test
  DEMO_MODE: "true"
  NEXT_PUBLIC_APP_ENV: test
  NEXT_PUBLIC_DEMO_MODE: "true"

jobs:
  fast-checks:
    name: Fast checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.2
          cache: npm
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: 0.11.28
          enable-cache: true
      - run: npm ci
      - run: uv sync --project apps/api --frozen
      - run: npm run openapi
      - run: git diff --exit-code -- openapi.json packages/api-client/src/schema.ts
      - run: npm --workspace @praxisai/web run format
      - run: uv run --project apps/api ruff format --check apps/api
      - run: npm run lint
      - run: npm run typecheck
      - run: npm --workspace @praxisai/web run test

  integration:
    name: PostgreSQL migrations and API tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_DB: praxisai
          POSTGRES_USER: praxisai
          POSTGRES_PASSWORD: praxisai_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U praxisai -d praxisai"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://praxisai:praxisai_test@localhost:5432/praxisai
      DATABASE_MIGRATION_URL: postgresql+asyncpg://praxisai:praxisai_test@localhost:5432/praxisai
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: 0.11.28
          enable-cache: true
      - run: uv sync --project apps/api --frozen
      - run: uv run --project apps/api alembic -c apps/api/alembic.ini upgrade head
      - run: uv run --project apps/api alembic -c apps/api/alembic.ini check
      - run: uv run --directory apps/api --project . pytest tests

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.2
          cache: npm
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: 0.11.28
          enable-cache: true
      - run: npm ci
      - run: uv sync --project apps/api --frozen
      - run: npm audit --audit-level=high
      - run: uv run --project apps/api pip-audit
      - name: Scan Git history for secrets
        run: >-
          docker run --rm -v "$PWD:/repo"
          ghcr.io/gitleaks/gitleaks@sha256:cdbb7c955abce02001a9f6c9f602fb195b7fadc1e812065883f695d1eeaba854
          git /repo --redact --no-banner --exit-code 1

  build:
    name: Production builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.2
          cache: npm
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.9.8
      - run: npm ci
      - run: terraform -chdir=infra/terraform fmt -check
      - run: terraform -chdir=infra/terraform init -backend=false -input=false
      - run: terraform -chdir=infra/terraform validate
      - run: npm run build
      - name: Build API image with provenance and SBOM
        run: >-
          docker build --provenance=mode=max --sbom=true
          -f apps/api/Dockerfile -t praxisai-api-ci apps/api
      - name: Build web image with provenance and SBOM
        run: >-
          docker build --provenance=mode=max --sbom=true
          -f apps/web/Dockerfile -t praxisai-web-ci
          --build-arg NEXT_PUBLIC_APP_ENV=test
          --build-arg NEXT_PUBLIC_DEMO_MODE=true .
      - name: Scan API image
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          image: praxisai-api-ci
          fail-build: true
          severity-cutoff: high
      - name: Scan web image
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          image: praxisai-web-ci
          fail-build: true
          severity-cutoff: high

  e2e:
    name: Playwright functional and visual tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.2
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
