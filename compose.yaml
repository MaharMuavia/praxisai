services:
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: praxisai
      POSTGRES_USER: praxisai
      POSTGRES_PASSWORD: praxisai_local
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U praxisai -d praxisai"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - praxisai-postgres:/var/lib/postgresql/data

volumes:
  praxisai-postgres:

